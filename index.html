<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Estilos de motion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: filtros no topo, grade de capas 16:9; ao clicar, o estilo abre em destaque acima da grade. */
  :root {
    --bg: #f3f2ef; --fg: #17181c; --muted: #61646d; --line: #dcdad4; --card: #ffffff; --accent: #2f5bea; --on-accent: #ffffff;
    --ok: #1f8a4c; --base: #b7791f; --demanda: #6b6f7a;
    --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-disp: "Space Grotesk", "Inter", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111214; --fg: #ececef; --muted: #9a9da7; --line: #2a2c31; --card: #191a1e; --accent: #7d9bff; --on-accent: #0f1116; --ok: #4cc27f; --base: #e0a64a; --demanda: #8f939e; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #111214; --fg: #ececef; --muted: #9a9da7; --line: #2a2c31; --card: #191a1e; --accent: #7d9bff; --on-accent: #0f1116; --ok: #4cc27f; --base: #e0a64a; --demanda: #8f939e; color-scheme: dark }
  [hidden] { display: none !important }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }
  .wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted) }
  h1 { margin: 2px 0 0; font-family: var(--f-disp); font-size: 32px; letter-spacing: -.02em }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
  .chip { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13px; cursor: pointer }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
  .busca { flex: 1 1 200px; min-width: 0; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 14px }
  button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .fundo-modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)) }
  .destaque { position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; width: min(1000px, 100%); max-height: 100%; overflow: auto; box-sizing: border-box }
  .fechar { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-size: 18px; cursor: pointer }
  body.travado { overflow: hidden }
  .destaque img, .destaque video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; max-width: 100%; background: #000; display: block }
  .destaque h2 { margin: 4px 0 8px; font-family: var(--f-disp); font-size: 26px }
  .destaque p { margin: 0 0 10px; line-height: 1.5; font-size: 15px }
  .rotulo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
  .usar { margin-top: 6px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer }
  .nota { font-size: 13px; color: var(--muted) }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 6px }
  .acoes .usar { margin-top: 0 }
  .assistir { display: inline-block; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 11px 18px; font-weight: 700; text-decoration: none }
  .assistir:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600 }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50% ; background: currentColor }
  .s-pronto { color: var(--ok) } .s-base { color: var(--base) } .s-sob-demanda { color: var(--demanda) }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px }
  .card { display: flex; flex-direction: column; gap: 6px; text-align: left; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 12px; font: inherit; cursor: pointer; min-width: 0 }
  .card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) }
  .card img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; max-width: 100%; background: var(--line) }
  .card .nome { font-weight: 700; font-size: 15px; padding: 0 4px }
  .card .vis { font-size: 13px; color: var(--muted); line-height: 1.4; padding: 0 4px }
  .card .status { padding: 0 4px }
  .vazio { color: var(--muted) }
  @media (max-width: 760px) { .destaque { grid-template-columns: minmax(0, 1fr) } .grade { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) } .card .vis { display: none } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<div class="wrap">
  <header>
    <p class="eyebrow" id="contagem">Catálogo</p>
    <h1>Estilos de motion</h1>
  </header>
  <div class="filtros" id="filtros">
    <input class="busca" id="busca" type="search" placeholder="Buscar: aquarela, pixel, luxo, produto…" aria-label="Buscar estilo">
  </div>
  <div class="grade" id="grade"></div>
</div>
<div class="fundo-modal" id="modal" hidden><section class="destaque" id="destaque" role="dialog" aria-modal="true" aria-label="Detalhes do estilo"></section></div>
<script src="dados.js"></script>
<script>
(() => {
  const D = window.__CATALOGO__;
  const STATUS = {"pronto": "Pronto no motor", "base": "Versão inicial (vai ser refeita)", "sob-demanda": "Construído na 1ª vez que usar"};
  let cat = "todas", sel = null, termo = "", origem = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const filtros = $("filtros");
  const cats = [["todas", "Todas"], ...Object.entries(D.categorias).filter(([k]) => D.estilos.some((e) => e.cat === k))];
  cats.forEach(([k, nome]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = nome; b.dataset.cat = k;
    b.onclick = () => { cat = k; desenha(); };
    filtros.insertBefore(b, $("busca"));
  });
  $("busca").addEventListener("input", (e) => { termo = e.target.value.toLowerCase(); desenha(); });
  const destaque = () => {
    const e = D.estilos.find((x) => x.id === sel);
    $("destaque").innerHTML = `<button type="button" class="fechar" id="fechar" aria-label="Fechar">✕</button>
      <div class="midia">${e.video ? `<video id="vid" src="${e.video}" poster="${e.capa || ""}" controls autoplay muted playsinline loop preload="metadata"></video>` : (e.capa ? `<img src="${e.capa}" alt="Exemplo do estilo ${esc(e.nome)}">` : "")}</div>
      <div>
        <span class="rotulo">${esc(D.categorias[e.cat])}</span>
        <h2>${esc(e.nome)}</h2>
        <p>${esc(e.visual)}</p>
        <p><span class="rotulo">Combina com</span><br>${esc(e.combina)}</p>
        <p class="status s-${e.status}">${STATUS[e.status]}</p>
        <div class="acoes">
          <button type="button" class="usar" id="usar">Usar este estilo</button>
        </div>
        <p class="nota" id="nota">${e.lemo ? "Demo original do estilo (em inglês). No seu vídeo ele usa as cores, a voz e o conteúdo da sua marca." : "Quadros de um vídeo real feito neste estilo."}</p>
      </div>`;
    $("fechar").onclick = fecha;
    const v = $("vid");
    if (v) v.addEventListener("error", () => { v.outerHTML = `<img src="${e.capa}" alt=""><p class="nota">Não foi possível tocar o vídeo aqui.</p>`; }, {once: true});
    $("usar").onclick = async () => {
      const txt = `"estilo": "${e.id}"`;
      try { await navigator.clipboard.writeText(txt); $("usar").textContent = "Copiado ✓"; }
      catch { $("nota").textContent = `Copie e mande no chat: ${txt}`; }
    };
  };
  const abre = (id, el) => { sel = id; origem = el; destaque(); $("modal").hidden = false; document.body.classList.add("travado"); $("fechar").focus({preventScroll: true}); };
  const fecha = () => { const v = $("vid"); if (v) v.pause(); $("modal").hidden = true; document.body.classList.remove("travado"); if (origem) origem.focus({preventScroll: true}); };
  $("modal").addEventListener("click", (e) => { if (e.target === $("modal")) fecha(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("modal").hidden) fecha(); });
  const desenha = () => {
    filtros.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cat === cat)));
    const lista = D.estilos.filter((e) => (cat === "todas" || e.cat === cat) && (!termo || (e.nome + " " + e.visual + " " + e.combina).toLowerCase().includes(termo)));
    $("contagem").textContent = `Catálogo · ${lista.length} de ${D.estilos.length} estilos`;
    $("grade").innerHTML = lista.length ? lista.map((e) => `
      <button type="button" class="card" data-id="${e.id}" >
        ${e.capa ? `<img src="${e.capa}" alt="" loading="lazy">` : ""}
        <span class="nome">${esc(e.nome)}</span>
        <span class="vis">${esc(e.visual)}</span>
        <span class="status s-${e.status}">${e.status === "pronto" ? "Pronto" : e.status === "base" ? "Versão inicial" : "Sob demanda"}</span>
      </button>`).join("") : `<p class="vazio">Nenhum estilo com esse filtro.</p>`;
    $("grade").querySelectorAll(".card").forEach((c) => c.onclick = () => abre(c.dataset.id, c));
  };
  desenha();
})();
</script>

</html>
