<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Elon Musk e a Dogecoin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: player 9:16 à esquerda, roteiro clicável à direita; empilha no celular. */
  :root {
    --bg: #f2f3f6; --fg: #14171f; --muted: #5d6472; --line: #d9dce4; --card: #ffffff; --accent: #2f5bea; --accent-soft: #e3e9fd;
    --f-ui: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-num: "JetBrains Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1116; --fg: #e9ebf1; --muted: #9aa1b0; --line: #262a35; --card: #171a22; --accent: #7d9bff; --accent-soft: #1d2540; color-scheme: dark } }
  :root[data-theme="dark"] { --bg: #0f1116; --fg: #e9ebf1; --muted: #9aa1b0; --line: #262a35; --card: #171a22; --accent: #7d9bff; --accent-soft: #1d2540; color-scheme: dark }
  body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
  .wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 28px; max-width: 1080px; margin: 0 auto; align-items: start }
  .tela { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px) }
  .velocidades { display: flex; gap: 6px; justify-content: center; margin-top: 8px }
  .velocidades button { font: 600 13px var(--f-ui, system-ui); padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--card, #fff); color: var(--fg, #111); cursor: pointer }
  .velocidades button.ativa { background: var(--accent, #2f5bea); border-color: var(--accent, #2f5bea); color: #fff }
  .registro { margin-top: 10px; font: 500 13px/1.4 var(--f-ui, system-ui) }
  .registro button { font: 600 13px var(--f-ui, system-ui); padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--card, #fff); color: var(--fg, #111); cursor: pointer }
  .registro pre { white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; font-size: 11px; background: var(--card, #fff); border: 1px solid var(--line, #ddd); border-radius: 8px; padding: 8px }
  .aviso-registro { color: #b4231b; font-weight: 600 }
  .erros { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #fdecec; color: #7a1414; font: 500 13px/1.4 var(--f-ui, system-ui) }
  .erros pre { white-space: pre-wrap; word-break: break-word; max-height: 140px; overflow: auto; margin: 6px 0; font-size: 12px }
  .erros button { font: 600 13px var(--f-ui, system-ui); padding: 4px 10px; border-radius: 8px; border: 1px solid #c95b5b; background: #fff; color: #7a1414; cursor: pointer }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .erros { background: #3a1616; color: #ffd6d6 } }
  .info { min-width: 0 }
  .eyebrow { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
  h1 { margin: 6px 0 4px; font-size: 26px; line-height: 1.15; text-wrap: balance }
  .versao { margin: 0 0 18px; font-size: 13px; color: var(--muted) }
  .cenas { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
  .cenas button { width: 100%; display: flex; gap: 12px; text-align: left; background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; font-size: 14px; line-height: 1.4; cursor: pointer }
  .cenas button:hover { border-color: var(--accent) }
  .cenas button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .cenas button.ativa { background: var(--accent-soft); border-color: var(--accent) }
  .tempo { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; padding-top: 2px; flex-shrink: 0 }
  .txt { min-width: 0 }
  .bloco { display: inline-block; margin-right: 8px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent) }
  .vel { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap }
  .vel span { margin-right: 4px }
  .vel button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit; font-family: var(--f-num); font-size: 13px; cursor: pointer }
  .vel button.on { background: var(--accent); border-color: var(--accent); color: var(--bg) }
  .vel button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .estilo { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); margin: 2px 0 8px }
  .estilo select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px }
  details { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px }
  summary { cursor: pointer; font-weight: 600; font-size: 14px }
  .legenda { white-space: pre-wrap; font-size: 14px; line-height: 1.5 }
  .fontes { padding-left: 18px; font-size: 13px; overflow-wrap: anywhere }
  .fontes a { color: var(--accent) }
  @media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr) } .tela { position: static; max-width: 380px; margin: 0 auto; width: 100% } }
</style>

<script src="app.js?v=mx015rk2"></script>

</body></html>
